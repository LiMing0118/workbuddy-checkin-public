name: Native schedule diagnostic (temporary)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger without credentials
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
